# Curated application requirements per program for Justin's 2026-2027 cycle.
# (Justin applies in fall 2026 for fall 2027 entry.)
#
# This is the source of truth — committed, hand-edited, and loaded into the
# SQLite `requirements` table by tools/load_requirements.py. The companion
# tools/fetch_requirements_pages.py captures HTML snapshots in .tmp/requirements/
# for provenance.
#
# Schema (see workflows/build_requirements_checklist.md for the full spec):
#   program_key                 — must match a program in config/programs.yaml
#   tier                        — copied from programs.yaml for convenience
#   source_url                  — the page each fact came from
#   curated_on                  — ISO date of last curation pass
#   confidence                  — high | medium | low | needs_verification
#   curator_notes               — anything the curator wants future-self to know
#
#   Dates are ISO YYYY-MM-DD and are REAL 2026-2027 cycle dates (fall-2026
#   application for fall-2027 entry). The dashboard renders them as-is; the
#   old +365-day shift in tools/build_webdash.py was removed on 2026-09-18.
#   Each entry's curator_notes says whether its dates were verified against
#   the official 2026-27 page or carried forward from the 2025-26 pattern.
#
#   Use null (not omitted) when a field is genuinely unknown, so the dashboard
#   can display "—" rather than silently dropping the field.

dates_cycle_template: "2026-2027"
dates_note: |
  Dates are Justin's actual 2026-2027 cycle dates. Verified 2026-09-18 against
  official pages: OUAC (opened 2026-09-17; equal consideration 2027-01-15),
  Waterloo (Engineering 2027-01-15 / docs 2027-02-01; all other programs incl.
  CS and Math 2027-02-01 / docs 2027-02-15 — a change from the Jan 30 / Feb 13
  pattern of prior cycles), Queen's (Health Sci PSE 2027-02-15; documents
  2027-03-31), U of T (2027-01-15; A&S documents 2027-02-01; early-round
  targets apply by 2026-11-07, documents by 2026-12-01), Western (equal
  consideration 2027-01-15), UAlberta (verified 2026-09-17). McMaster HHSP
  pages are Cloudflare-blocked; its supp-app window is only described as
  "early/mid-February 2027, instructions emailed in January". Tier-2 document
  deadlines not named on an official page are carried forward on the same
  calendar date as 2025-26 and flagged in curator_notes.

requirements:

  # ───────────────────── Tier 1 — Top targets ─────────────────────

  - program_key: mcmaster_bhsc
    tier: 1
    source_url: https://bhsc.mcmaster.ca/future-students/admissions/
    fallback_source_url: https://hhsp.healthsci.mcmaster.ca/
    curated_on: 2026-09-18
    confidence: high
    curator_notes: |
      Format details verified against the official 2025 Supplementary
      Application Questions PDF (archived from hhsp.healthsci.mcmaster.ca,
      Wayback snapshot 2025-01-23). Live HHSP pages are Cloudflare-protected
      and refuse automated fetches, but the archived official PDF gives
      authoritative supp-app structure, character limits, and the GenAI
      prohibition. The bhsc.mcmaster.ca subdomain 301-redirects to
      hhsp.healthsci.mcmaster.ca; HHSP is the program's current home.
      2026-09-18 re-verification: OUAC 2027-01-15 confirmed (OUAC). HHSP's
      2026-27 pages (and the 2027 questions PDF, which search engines have
      indexed) are Cloudflare-blocked to us; search snippets of the HHSP
      site say questions are posted in September, submission instructions
      are emailed in January, and the Level I submission deadline is
      "early/mid-February 2027". The supp date below is therefore an
      ESTIMATE from the 2024-25 window (Feb 3-6).
      2026-09-18 (later, via the r.jina.ai proxy which gets past Cloudflare):
      the HHSP supplementary-application page, the Level I page and the
      2027 questions page ALL still read "Coming Soon" for every 2026-27
      date (questions posted / OUAC deadline / instructions email / portal
      access / offers). The 2026 questions PDF has been taken down (404).
      Level I page verified: "over 8,000 applicants annually for only 240
      spots"; "minimum secondary school grade point average of 90%";
      "Simply meeting the academic requirements does not ensure admission."
      PREREQ CORRECTION: the earlier curation said only English was
      required — the official Level I page and future.mcmaster.ca list SIX
      required courses (see prereq_courses), including a non-math /
      non-science / non-technology credit. Re-check the HHSP page monthly
      until the 2027 dates and PDF appear (reminder in the profile).

    application_deadline_ouac: 2027-01-15        # OUAC equal-consideration, verified 2026-09-18
    application_deadline_supp: 2027-02-05        # ESTIMATE — "early/mid-February 2027" portal window (~3–4 days); instructions emailed in January; confirm on the HHSP page
    document_deadline: 2027-02-05
    decision_release_window: "Early May (HHSP FAQ, verified 2026-09-18: 'Admission offers will be made in early May'; earlier curation also noted an early-March wave — unconfirmed)"

    supp_app_required: true
    supp_app_type: "2 written essays (1500 characters each, including spaces); choose 1 of 3 prompts for Q1 + 1 of 3 prompts for Q2"
    supp_app_url: https://hhsp.healthsci.mcmaster.ca/future-students/supplementary-application/
    supp_app_notes: |
      McMaster posts the year's Supp App Questions PDF publicly in September,
      so applicants see the prompts months before the portal opens. Applicants
      choose 1 of 3 options for Question 1 and 1 of 3 options for Question 2
      (so 2 essays drawn from a pool of 6 prompts), with a hard 1500-character
      cap per response (including punctuation and spaces). Submission
      instructions are emailed in late January, and the online portal is open
      for only ~3–4 days in early February (Feb 3–6 in the 2024-25 cycle).
      Extensions are not granted.

      Prompts are problem-based and philosophical, designed to test how an
      applicant thinks — 2025 prompts covered cognitive engagement in the
      age of GenAI, Indigenous Seven Grandfather Teachings, interdisciplinary
      synergies between health and other fields, and admissions-policy design.

      Generative AI is explicitly prohibited: "use of generative AI to write
      the response are not permitted, and may result in removal from the
      applicant pool." Proofreading tools and human feedback are acceptable
      but "the writing itself must be your own work." Posting answers online
      or working with others on responses is also disqualifying.

      HHSP Supplementary Application FAQs (verified 2026-09-18): "The
      Supplementary Application submission deadline is firm and no
      extensions will be given if this deadline is missed." Generative AI
      "is not permitted and may result in removal from the applicant pool
      or withdrawal of an offer of admission" — i.e. it can be enforced
      after an offer. Discussing answers with others, posting them online,
      and HIRING ADMISSIONS CONSULTANTS are all named as academic-integrity
      breaches. Each application is scored by multiple reviewers (faculty,
      staff, Level IV students) with extra reviewers when scores diverge.
      The 2-of-6-prompts / 1500-character format is from the 2025 PDF; the
      2027 PDF is not posted yet, so treat the format as unconfirmed for
      this cycle.

      The supp app is the primary differentiator above the ~90% grade floor.

    casper_required: false
    casper_format: null
    interview_required: false
    interview_format: null
    references_required: false
    references_count: null

    min_average_competitive: 90.0
    prereq_courses:
      - "Grade 12 English (ENG4U) — required"
      - "Grade 12 Biology (SBI4U) — required"
      - "Grade 12 Chemistry (SCH4U) — required"
      - "One of Advanced Functions (MHF4U), Calculus & Vectors (MCV4U), or Data Management (MDM4U) — required"
      - "One non-math, non-science, non-technology 4U/4M credit — required"
      - "One additional Grade 12 U/M course (six courses total)"
    prereq_notes: |
      Verified 2026-09-18 on the HHSP Level I page and future.mcmaster.ca:
      six required courses, and the 90% minimum is computed on those six
      (the "six mandatory courses"), not a free top-6. Justin's Alberta set
      maps exactly onto them — ELA 30-1 (English), Biology 30, Chemistry 30,
      Math 30-1 or Math 31 (math), French 30-1 (the non-math / non-science /
      non-technology credit), and the other math as the sixth course. So
      the six courses McMaster averages are the same six he is taking, and
      ELA 30-1 (weakest, ~87.5 midpoint) is inside that average with no
      substitute available. HHSP Future Students FAQ: "For applicants who
      present more than one of these math courses, the highest grade at the
      time of review will be used" — Math 30-1 (diploma 100%) is the math
      mark that counts. future.mcmaster.ca: "Applicants from other
      provinces / jurisdictions should contact the Admissions Office if
      they are unsure about the eligibility of a particular course" —
      email McMaster Admissions in October to confirm French 30-1 satisfies
      the non-STEM credit and Math 31 the math prerequisite.

    oop_eligible: true
    oop_notes: |
      Open to all Canadian high school students, including 105 / Group B
      applicants from Alberta. **However, the Reddit dataset shows zero OOP
      acceptances below 97.8% across 4 cycles (n=5 OOP reports).** Justin at
      ~95.5% is below this observed floor. Take this as a strong signal that
      the OOP supplementary application bar at McMaster BHSc is meaningfully
      higher than the in-province bar.

    application_fee_cad: 156   # OUAC base fee for 3 program choices; supp app fee not included

    notes: |
      One of the most competitive direct-entry undergraduate programs in
      Canada. The supplementary application + interview-style reflective
      writing is the dominant signal — Reddit data shows the accepted vs
      rejected averages at McMaster BHSc differ by only ~0.8 points in 24-25.
      Justin can compensate for the OOP gap with an exceptional supp app, but
      the bar is realistically a reach.

  - program_key: queens_bhsc
    tier: 1
    source_url: https://bhsc.queensu.ca/future-students/admission
    supp_app_source_url: https://bhsc.queensu.ca/future-students/supplementary-application
    curated_on: 2026-09-18
    confidence: high
    curator_notes: |
      Format and timing details confirmed against the official Queen's BHSc
      supplementary application page and the queensu.ca PSE FAQ on 2026-04-25.
      2026-09-18: 2027 dates verified on queensu.ca/admission/applying/
      dates-deadlines — Health Sciences supplementary application deadline
      February 15, 2027; all documents by March 31, 2027; Queen's recommends
      applying on OUAC by November 20 to have time for the Major Admission
      Award (MAA) application. The OUAC date is the universal Ontario Jan 15. Queen's BHSc has both an
      on-campus stream (QH) and an online stream; the on-campus stream is what
      most applicants pursue and is what is reflected here. The on-campus
      program uses a flipped-classroom model — most lectures are asynchronous
      and class time is for inquiry/discussion — so the PSE rubric heavily
      rewards demonstrated self-direction and time management.

      In-cycle observation (2025-26): a clustered wave of acceptances landed
      in the Reddit dataset on 2026-04-14 (offers spanning 95–99% averages),
      ahead of the official "by mid-May" commitment. The decision_release_window
      string captures this rolling pattern.

    application_deadline_ouac: 2027-01-15
    application_deadline_supp: 2027-02-15        # PSE deadline verified 2026-09-18 on the Queen's dates page
    document_deadline: 2027-03-31                # Queen's universal document deadline (verified 2026-09-18); send the transcript with the OUAC application regardless
    decision_release_window: "Rolling; Queen's assesses applications and makes offers until mid-May; accept by June 1 (queensu.ca key dates, verified 2026-09-21). 2025-26 Reddit data showed a BHSc offer cluster on April 14."

    supp_app_required: true
    supp_app_type: "Personal Statement of Experience (PSE) on Kira Talent — 1 timed written response (10 min, 335-word cap) + 1 video response (2 min prep + 2 min delivery)"
    supp_app_url: https://bhsc.queensu.ca/future-students/supplementary-application
    supp_app_notes: |
      Delivered through Kira Talent. Applicants complete the written response
      first (10 minutes to write and submit, 335-word hard cap — the FAQ warns
      "exceeding the word limit will negatively affect your application"),
      then the video response (2 minutes to prepare, 2 minutes to deliver).
      Total assessment is ~30 minutes; can be done in one sitting or split
      across sessions, but the written piece must be finished before starting
      the video.

      Mandatory practice questions are part of the check-in process so
      applicants can get comfortable with the platform before submitting.
      Question text is not released in advance; applicants get questions at
      random and re-takes also draw new questions at random.

      "Queen's does not accept late submissions." Additional materials
      (reference letters, CV, etc.) will not be reviewed. Required for the
      on-campus stream. Read by trained committees including reviewers from
      Health Sciences, Nursing, and Commerce. Kira Talent does not recommend
      third-party browser extensions (e.g. Grammarly) during submission due to
      platform compatibility issues.

    casper_required: false
    casper_format: null
    interview_required: false
    interview_format: null
    references_required: false
    references_count: null

    min_average_competitive: 90.0  # "anticipated that the admission average will be over 90% for the on-campus BHSc"
    prereq_courses:
      - "Grade 12 English (ENG4U) — minimum 80% required"
      - "Grade 12 Biology (SBI4U) — required"
      - "Grade 12 Chemistry (SCH4U) — required"
      - "Grade 12 Math: one of Advanced Functions (MHF4U) or Calculus & Vectors (MCV4U) — required"
      - "2 additional Grade 12 4U or 4M courses"
    prereq_notes: |
      Minimum 75% cumulative average required for consideration. Justin's
      Alberta equivalents satisfy these: ELA 30-1 (must hit ≥80% — currently
      projected 85-90), Biology 30, Chemistry 30, Math 30-1 (Pure Math = AB
      Advanced Functions equivalent), Math 31 (= Calculus & Vectors), French
      30-1. **The 80% English minimum is the field to watch — Justin's ELA
      30-1 projection of 85-90 has cushion but no margin for slipping.**

    oop_eligible: true
    oop_notes: |
      Open to all Canadian high school students. Reddit data (n=7 OOP) shows
      no clear OOP penalty: in-province mean accepted avg 96.2 vs OOP mean
      96.4. Queen's BHSc looks like Justin's most realistic Tier-1 BHSc
      target.

    application_fee_cad: 156

    notes: |
      Smaller and newer than McMaster's BHSc but increasingly competitive.
      The PSE (1 written + 1 video) is the differentiator. Reddit data shows
      median accepted avg 96.5%, very close to McMaster's 97.0. The 80%
      English floor and the "no late submissions" rule are the two
      compliance gates Justin needs to clear absolutely.

